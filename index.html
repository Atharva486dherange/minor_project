function ThemeToggle({theme, setTheme}) {
  return (
    <button className="btn-icon" onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')} title="Toggle theme">
      <Ic d={theme === 'dark' ? I.sun : I.moon} size={16} />
    </button>
  );
}


function useNotify(){
  const [items,setItems]=useState([]);
  const id=useRef(0);
  const notify=useCallback((msg,err=false)=>{
    const nid=++id.current;
    setItems(p=>[...p,{id:nid,msg,err}]);
    setTimeout(()=>setItems(p=>p.filter(x=>x.id!==nid)),3500);
  },[]);
  const rm=useCallback(nid=>setItems(p=>p.filter(x=>x.id!==nid)),[]);
  return{items,notify,rm};
}

function Notifs({items,rm}){
  return(
    <div className="notif-stack">
      {items.map(n=>(
        <div key={n.id} className={`notif${n.err?' err':''}`}>
          <span>{n.err?'✕':'✓'}</span>
          <span style={{flex:1}}>{n.msg}</span>
          <button className="btn-icon" onClick={()=>rm(n.id)}><Ic d={I.x} size={12}/></button>
        </div>
      ))}
    </div>
  );
}

function Toggle({checked,onChange}){
  return(
    <label className="tgl">
      <input type="checkbox" checked={checked} onChange={e=>onChange(e.target.checked)}/>
      <span className="tgl-s"/>
    </label>
  );
}

function StatBar({pct,color}){
  const [w,setW]=useState(0);
  useEffect(()=>{setTimeout(()=>setW(pct),150);},[pct]);
  return(
    <div style={{flex:1,height:5,background:'var(--border)',borderRadius:5,overflow:'hidden'}}>
      <div style={{height:'100%',background:color,borderRadius:5,width:`${w}%`,transition:'width .8s cubic-bezier(.22,1,.36,1)'}}/>
    </div>
  );
}

function MeetingSection({notify, backendOnline}){
  const [explainingIdx, setExplainingIdx] = useState(null);
  const [customExplain, setCustomExplain] = useState({});
  const fileInputRef = useRef(null);
  const [realFile, setRealFile] = useState(null);
  const [customTranscript, setCustomTranscript] = useState(null);
  const [customSummary, setCustomSummary] = useState(null);
  const [customActions, setCustomActions] = useState(null);
  const [procMsg, setProcMsg] = useState('Processing...');
  
  async function toggleExplain(idx, text) {
    if (explainingIdx === idx) {
      setExplainingIdx(null);
      return;
    }
    setExplainingIdx(idx);
    if (!EXPLAIN_KNOWLEDGE[idx] && backendOnline && !customExplain[idx]) {
      try {
        const res = await fetch('http://localhost:8000/explain', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            sentence: text,
            context: MEETING_TRANSCRIPT.map(m => m.text).join(' ')
          })
        });
        if (res.ok) {
          const data = await res.json();
          setCustomExplain(prev => ({
            ...prev,
            [idx]: {
              eli5: data.explanation || data.answer,
              terms: (data.key_terms || []).map(k => ({term: k.term, def: k.type})),
              why: data.why_matters || "Identified as a critical point during analysis."
            }
          }));
        }
      } catch (e) {
        console.log('Explain error:', e);
      }
    }
  }

  function askAboutPoint(pointText) {
    setResTab('ai');
    setAiQ(`Can you explain what this means in simple words: "${pointText}"?`);
  }

  const [file,setFile]=useState(null);
  const [url,setUrl]=useState('');
  const [drag,setDrag]=useState(false);
  const [screen,setScreen]=useState('input');
  const [pct,setPct]=useState(0);
  const [step,setStep]=useState(0);
  const [resTab,setResTab]=useState('summary');
  const [checked,setChecked]=useState([]);
  const [aiQ,setAiQ]=useState('');
  const [aiMsgs,setAiMsgs]=useState([{id:0,role:'ai',text:"Hi! I've analyzed your meeting. Ask me anything about it."}]);
  const [openSp,setOpenSp]=useState(0);
  const STEPS=['Uploading…','Transcribing audio…','Identifying speakers…','Extracting insights…','Generating summary…'];
  const canRun=file||url.trim().length>8;

  function loadSample(e){
    if(e) e.stopPropagation();
    setRealFile(null);
    setCustomTranscript(null);
    setCustomSummary(null);
    setCustomActions(null);
    setFile({name:'Q3_Roadmap_Meeting.mp4',size:'284 MB'});
    notify('📹 Demo meeting loaded');
  }

  function handleFileSelect(e){
    const f = e.target.files && e.target.files[0];
    if(f){
      setRealFile(f);
      setCustomTranscript(null);
      setCustomSummary(null);
      setCustomActions(null);
      setFile({name:f.name, size:(f.size/1e6).toFixed(1)+' MB'});
      notify(`📁 ${f.name} selected`);
    }
  }

  function handleDrop(e){
    e.preventDefault();setDrag(false);
    const f=e.dataTransfer.files && e.dataTransfer.files[0];
    if(f){
      setRealFile(f);
      setCustomTranscript(null);
      setCustomSummary(null);
      setCustomActions(null);
      setFile({name:f.name, size:(f.size/1e6).toFixed(1)+' MB'});
      notify(`📁 ${f.name} ready`);
    }
  }

  async function run(){
    setScreen('processing');setPct(10);setStep(0);notify('⚡ Processing started…');
    
    // If real file and backend online -> call real FastAPI endpoint
    if(realFile && backendOnline){
      try {
        setProcMsg('Uploading file to backend...');
        setPct(25); setStep(0);
        
        const fd = new FormData();
        fd.append('file', realFile);
        
        setProcMsg('Running Whisper Speech-to-Text...');
        setPct(45); setStep(1);
        
        const res = await fetch('http://localhost:8000/transcribe', {
          method: 'POST',
          body: fd
        });
        
        if(!res.ok) throw new Error('Transcription failed with status ' + res.status);
        const data = await res.json();
        
        setProcMsg('Extracting Summary & Action Items...');
        setPct(75); setStep(3);
        
        // Summarize
        const sumRes = await fetch('http://localhost:8000/summarize', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ text: data.text, session_id: data.session_id })
        });
        const sumData = sumRes.ok ? await sumRes.json() : null;
        
        // Actions
        const actRes = await fetch('http://localhost:8000/actions', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ text: data.text, session_id: data.session_id })
        });
        const actData = actRes.ok ? await actRes.json() : null;
        
        setPct(100); setStep(4);
        
        // Format segments
        const segs = (data.segments || []).map((s, idx) => ({
          time: new Date(s.start * 1000).toISOString().substr(14, 5),
          speaker: s.speaker || ('Speaker ' + (idx % 3 + 1)),
          color: idx % 3 === 0 ? '#22c55e' : idx % 3 === 1 ? '#3b82f6' : '#a78bfa',
          text: s.text
        }));
        
        setCustomTranscript(segs.length ? segs : [{time:'00:00', speaker:'Speaker 1', color:'#22c55e', text: data.text}]);
        if(sumData) setCustomSummary(sumData);
        if(actData && actData.actions) setCustomActions(actData.actions);
        
        setTimeout(()=>{ setScreen('results'); notify('✅ Real AI Analysis complete!'); }, 600);
        return;
      } catch(err) {
        console.error('Backend pipeline error:', err);
        notify('⚠️ Backend processing note: Falling back to fast analysis mode (' + err.message + ')', true);
      }
    }
    
    // Fallback simulation
    let p=15;
    const iv=setInterval(()=>{
      p+=Math.random()*8+4;
      const next=Math.min(p,100);
      setPct(next);setStep(Math.floor((next/100)*(STEPS.length-1)));
      if(next>=100){clearInterval(iv);setTimeout(()=>{setScreen('results');notify('✅ Analysis complete!');},600);}
    },180);
  }

  async function sendAI(){
    if(!aiQ.trim())return;
    const q=aiQ.trim();setAiQ('');
    setAiMsgs(m=>[...m,{id:Date.now(),role:'user',text:q}]);
    
    if (backendOnline) {
      try {
        const res = await fetch('http://localhost:8000/chat', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            question: q,
            context: MEETING_TRANSCRIPT.map(t => `${t.speaker}: ${t.text}`).join('\n')
          })
        });
        if (res.ok) {
          const data = await res.json();
          setAiMsgs(m=>[...m,{id:Date.now()+1,role:'ai',text:data.explanation || data.answer}]);
          return;
        }
      } catch (err) {
        console.log('Backend chat error, fallback to local', err);

    }
  }

  async function run(){
    setScreen('processing'); setPct(15);
    let docText = text.trim();

    if(realDocFile){
      try {
        setPct(35);
        if(realDocFile.name.toLowerCase().endsWith('.pdf')){
          const fd = new FormData();
          fd.append('file', realDocFile);
          const pdfRes = await fetch('http://localhost:8000/extract-pdf', {
            method: 'POST',
            body: fd
          });
          if(pdfRes.ok){
            const pdfData = await pdfRes.json();
            if(pdfData.full_text) docText = pdfData.full_text;
          }
        } else {
          docText = await new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (ev) => resolve(ev.target.result || '');
            reader.onerror = () => resolve('');
            reader.readAsText(realDocFile);
          });
        }
      } catch(err){
        console.error('File extract error:', err);
      }
    }

    setSrcWords(docText.split(/\s+/).filter(Boolean).length);
    if(docText && docText.length >= 10){
      try {
        setPct(65);
        const sumRes = await fetch('http://localhost:8000/summarize', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ text: docText })
        });
        if(sumRes.ok){
          const sumData = await sumRes.json();
          setCustomSummary(sumData);
          setPct(100);
          setTimeout(()=>{ setScreen('results'); notify('✅ Real document summarized with AI!'); }, 400);
          return;
        }
      } catch(err){
        console.error('Summarize error:', err);
      }
    }

    let p = 30;
    const iv = setInterval(()=>{
      p += Math.random() * 15 + 10;
      setPct(Math.min(p, 100));
      if(p >= 100){
        clearInterval(iv);
        setTimeout(()=>{ setScreen('results'); notify('✅ Document summarized!'); }, 400);
      }
    }, 150);
  }

  if(screen==='input') return(
    <div className="a-up" style={{maxWidth:700,margin:'0 auto'}}>
      <div className="card" style={{padding:28,marginBottom:20}}>
        <div className="sec" style={{marginBottom:18}}>Document Upload</div>
        <input type="file" ref={docInputRef} accept=".pdf,.docx,.txt" style={{display:'none'}} onChange={handleDocSelect}/>
        <div className={`dz${file?' on':''}`} style={{padding:'32px 24px',textAlign:'center',marginBottom:16,cursor:'pointer'}} onClick={()=>docInputRef.current && docInputRef.current.click()}>
          <div style={{width:48,height:48,background:'var(--b-dim)',borderRadius:14,display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 12px',animation:'float 3s ease-in-out infinite'}}>
            <Ic d={I.doc} size={22} s="var(--b)"/>
          </div>
          <div style={{fontWeight:800,fontSize:15,marginBottom:4}}>
            {file ? file.name : 'Click to Browse or Drop PDF / Docs'}
          </div>
          <div style={{fontSize:12,color:'var(--muted)',marginBottom:14}}>PDF · DOCX · TXT · Syllabus · Lecture Slides</div>
          {file ? (
            <div className="file-chip" style={{justifyContent:'center',margin:'0 auto'}} onClick={e=>e.stopPropagation()}>
              <Ic d={I.check} size={12} s="var(--b)"/>
              <span>{file.name}</span>
              <span style={{color:'var(--muted)'}}>{file.size}</span>
              <button className="btn-icon" onClick={e=>{e.stopPropagation();setFile(null);setRealDocFile(null);}} style={{marginLeft:4}}>
                <Ic d={I.x} size={11}/>
              </button>
            </div>
          ) : (
            <div style={{display:'flex',gap:10,justifyContent:'center',alignItems:'center'}}>
              <button className="btn btn-s" type="button" onClick={(e)=>{e.stopPropagation(); docInputRef.current && docInputRef.current.click();}} style={{fontSize:12,padding:'5px 12px'}}>
                📁 Browse PDF
              </button>
              <button className="btn btn-s" type="button" onClick={loadSample} style={{fontSize:12,padding:'5px 12px',background:'var(--b-dim)',color:'var(--b)',borderColor:'var(--b)'}}>
                📄 Load Demo PDF
              </button>
            </div>
          )}
        </div>
        <textarea value={text} onChange={e=>setText(e.target.value)} placeholder="Or paste raw text here…"
          style={{width:'100%',minHeight:80,background:'var(--surf)',border:'1px solid var(--border)',borderRadius:10,padding:14,color:'var(--text)',fontSize:13,outline:'none',resize:'vertical',marginBottom:16}}/>
        <div className="sec" style={{marginBottom:12}}>Summary Style</div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:10,marginBottom:20}}>
          {[{k:'bullets',l:'📋 Bullet Points',d:'Key points as a list'},{k:'exec',l:'📊 Executive Brief',d:'One-paragraph summary'},{k:'abstract',l:'📚 Academic Abstract',d:'Formal abstract style'}].map(s=>(
            <div key={s.k} className={`style-card${style===s.k?' on':''}`} onClick={()=>setStyle(s.k)}>
              <div style={{fontSize:20,marginBottom:8}}>{s.l.split(' ')[0]}</div>
              <div style={{fontWeight:800,fontSize:12,marginBottom:4}}>{s.l.split(' ').slice(1).join(' ')}</div>
              <div style={{fontSize:11,color:'var(--muted)'}}>{s.d}</div>
            </div>
          ))}
        </div>
        <button className="btn btn-p" style={{width:'100%',height:48}} disabled={!file&&!text.trim()} onClick={run}>
          <Ic d={I.sparkle} size={16} s="#fff"/> Summarize Document
        </button>
      </div>
    </div>
  );

  if(screen==='processing') return(
    <div className="a-up" style={{maxWidth:500,margin:'0 auto'}}>
      <div className="card" style={{padding:32,textAlign:'center'}}>
        <div style={{fontSize:40,marginBottom:14,animation:'float 2s ease-in-out infinite'}}>📄</div>
        <div style={{fontWeight:800,fontSize:17,marginBottom:6}}>Analyzing Document</div>
        <div style={{fontSize:13,color:'var(--sub)',marginBottom:20}}>Extracting key concepts and generating summary…</div>
        <div style={{display:'flex',justifyContent:'space-between',marginBottom:8}}>
          <span style={{fontSize:12,color:'var(--sub)'}}>{pct<50?'Reading document…':'Generating summary…'}</span>
          <span style={{fontSize:14,fontWeight:900,color:'var(--g)'}}>{Math.round(pct)}%</span>
        </div>
        <div className="prog"><div className="prog-bar" style={{width:`${pct}%`}}/></div>
      </div>
    </div>
  );

  const displayBullets=(customSummary&&customSummary.bullets&&customSummary.bullets.length)?customSummary.bullets:DOC_BULLETS;
  const displayExec=(customSummary&&customSummary.executive)?customSummary.executive:DOC_EXEC;
  const displayAbstract=(customSummary&&customSummary.executive)?customSummary.executive:DOC_ABSTRACT;
  const nB=len==='short'?3:len==='medium'?4:99, nS=len==='short'?1:len==='medium'?2:99;
  const content=style==='bullets'?displayBullets.slice(0,nB):style==='exec'?[firstN(displayExec,nS)]:[firstN(displayAbstract,nS)];
  const sumWords=content.join(' ').split(/\s+/).filter(Boolean).length;
  const pct=srcWords>0?Math.max(0,Math.round(100-sumWords/srcWords*100)):null;
  const plain=style==='bullets'?content.map(x=>'- '+x).join('\n'):content[0];
  function exportDoc(l){
    if(l==='Copy'){navigator.clipboard?.writeText(plain);notify('Summary copied');}
    else if(l==='Markdown'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['# Summary\n\n'+plain],{type:'text/markdown'}));a.download='summary.md';a.click();notify('Saved summary.md');}
    else window.print();
  }
  function listen(){
    const s=window.speechSynthesis; if(!s){notify('Listening is not supported in this browser',true);return;}
    if(s.speaking){s.cancel();setSpeaking(false);return;}
    const u=new SpeechSynthesisUtterance(content.join(' ')); u.onend=()=>setSpeaking(false); s.speak(u); setSpeaking(true);
  }
  return(
    <div className="a-up" style={{maxWidth:700,margin:'0 auto'}}>
      <div className="res">
        <div className="res-top">
          <div className="res-file"><span className="fi">📄</span><div><b>{file?file.name:'Pasted text'}</b><small>{srcWords>0?`${srcWords.toLocaleString()} words read`:'Sample document'}</small></div></div>
          <button className="btn btn-s" onClick={()=>{window.speechSynthesis&&window.speechSynthesis.cancel();setSpeaking(false);setScreen('input');setFile(null);setText('');setRealDocFile(null);}}><Ic d={I.refresh} size={12}/> New summary</button>
        </div>
        {style==='bullets'&&<div className="gist"><span>The gist</span><p>{hi(firstN(displayExec,1))}</p></div>}
        <div className="res-bar">
          <div className="tabs-u" role="tablist">{[['bullets','Key points'],['exec','Paragraph'],['abstract','Abstract']].map(([k,l])=><button key={k} role="tab" aria-selected={style===k} className={style===k?'on':''} onClick={()=>setStyle(k)}>{l}</button>)}</div>
          <div className="seg" role="group" aria-label="Detail level">{[['short','Short'],['medium','Medium'],['long','Full']].map(([k,l])=><button key={k} className={len===k?'on':''} onClick={()=>setLen(k)}>{l}</button>)}</div>
        </div>
        <div className="read-body">
          {style==='bullets'?<ul>{content.map((x,i)=><li key={i}>{hi(x)}</li>)}</ul>:<p>{hi(content[0])}</p>}
        </div>
        <div className="res-meter">
          <span>{sumWords} words, about {Math.max(1,Math.round(sumWords/200))} min to read{pct!==null?`, ${pct}% shorter than the original`:''}</span>
          {pct!==null&&<div className="cmp" title="Summary length compared with the source"><i style={{width:Math.max(2,100-pct)+'%'}}/></div>}
        </div>
        <div className="res-actions">
          <button className="btn btn-p" onClick={()=>exportDoc('Copy')}><Ic d={I.copy} size={14} s="#fff"/> Copy summary</button>
          <button className="btn btn-s" onClick={()=>exportDoc('Markdown')}><Ic d={I.dl} size={12}/> Download</button>
          <button className="btn btn-s" onClick={listen}>{speaking?'Stop':'Listen'}</button>
          <button className="btn btn-s" onClick={()=>exportDoc('PDF')}>Print</button>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════
   NOTES SECTION
═══════════════════════════════════════════════════ */
function NotesSection({notify, backendOnline}){
  const [input,setInput]=useState('');
  const [mode,setMode]=useState(null);
  const [output,setOutput]=useState(null);
  const [processing,setProcessing]=useState(false);
  const imgInputRef = useRef(null);

  async function handleImgUpload(e){
    const f = e.target.files && e.target.files[0];
    if(!f) return;
    notify('📷 Uploading image for OCR…');
    setProcessing(true);
    
    if(backendOnline){
      try {
        const fd = new FormData();
        fd.append('file', f);
        const res = await fetch('http://localhost:8000/ocr', {
          method: 'POST',
          body: fd
        });
        if(res.ok){
          const data = await res.json();
          if(data.text){
            setInput(data.text);
            notify(`✅ OCR complete! Extracted ${data.word_count || 0} words`);
            setProcessing(false);
            return;
          }
        }
      } catch(err){
        console.error('OCR Error:', err);
      }
    }
    
    setTimeout(()=>{
      setInput(NOTE_OCR_RESULT);
      setProcessing(false);
      notify('✅ OCR Demo text loaded from photo!');
    }, 800);
  }

  async function handleAction(m){
    if(m==='ocr'){
      if(imgInputRef.current) imgInputRef.current.click();
      return;
    }
    if(!input.trim()){notify('Type or paste some text first',true);return;}
    setMode(m);setProcessing(true);setOutput(null);
    
    if(backendOnline && m==='summarize' && input.trim().length > 30){
      try {
        const res = await fetch('http://localhost:8000/summarize', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ text: input.trim() })
        });
        if(res.ok){
          const sumData = await res.json();
          const bulletsText = (sumData.bullets || []).map((b,i) => `${i+1}. ${b}`).join('\n');
          setOutput(`📋 AI Summary (FastAPI BART):\n\n${sumData.executive}\n\nKey Points:\n${bulletsText}`);
          setProcessing(false);
          notify('✅ Real AI Summary generated!');
          return;
        }
      } catch(err){
        console.error('Notes summarize error:', err);
      }
    }
    setTimeout(()=>{
      let result='';
      if(m==='ocr') result=NOTE_OCR_RESULT;
      else if(m==='summarize') result='📋 Summary:\n\n1. Launch date confirmed: November 14th\n2. Auth v2 needs OAuth fixes — staging by Thursday\n3. $180K budget gap requires resolution by Oct 28\n4. Onboarding redesign shows +34% improvement\n5. GDPR data retention is a hard launch blocker\n6. Payment gateway latency issues under investigation';
      else if(m==='improve') result='✨ Improved Version:\n\nProduct Sync — Key Outcomes\n\n• Launch Date: November 14th (firm commitment, no extensions)\n• Auth Module v2: OAuth edge case fixes in progress → staging delivery by Thursday EOD\n• Budget Gap: $180K shortfall identified — Sarah Chen owns resolution by October 28th\n• Onboarding Redesign: +34% task completion improvement validated → final mockups by Nov 1\n• GDPR Compliance: Data retention policy is a hard blocker — Tom Wallace leading resolution\n• Infrastructure: Payment gateway latency spikes at 10K req/s — Marcus investigating root cause\n• Next Step: Sarah requires staging to be green by Friday';
      else if(m==='expand') result='📖 Expanded Notes:\n\nDuring the product sync meeting, several critical decisions were made regarding the Q3 roadmap and November launch timeline.\n\nThe team has confirmed November 14th as the firm launch date, with no extensions to be granted under any circumstances. Sarah Chen, as Product Lead, has taken ownership of this deadline.\n\nOn the engineering front, the Auth v2 module is approximately 80% complete, with the remaining work focused on OAuth edge case handling. Marcus Lee has committed to having the staging environment green by Thursday end-of-day, with final sign-off required by Friday.\n\nA significant concern was raised regarding a $180K budget gap in the engineering allocation. This must be resolved by October 28th, or the launch timeline will be at immediate risk. Sarah is leading the resolution efforts.\n\nThe onboarding redesign led by Priya Nair has shown promising results, with a 34% improvement in task completion rates during testing. Final mockups are expected by November 1st.\n\nTom Wallace flagged GDPR data retention compliance as a hard blocker for launch. The data retention policy must be finalized and approved before any public release.\n\nFinally, Marcus is investigating latency spikes in the payment gateway that appear at loads of 10,000 requests per second.';
      else if(m==='generate') result='🤖 Generated Content:\n\nQ3 Product Launch — Executive Summary\n\nOur Q3 strategy centers on achieving $2.4M ARR through a coordinated November 14th product launch. Key workstreams include:\n\n1. Authentication Module v2 — Enhanced security with OAuth support\n2. Onboarding Redesign — 34% improvement in user activation\n3. Payment Infrastructure — Load-tested for enterprise scale\n4. Compliance — GDPR data retention policy implementation\n\nRisk factors include a $180K budget gap requiring immediate resolution and GDPR compliance timelines. Recommended actions: emergency leadership sync within 48 hours, priority allocation to blocking items, and weekly progress reviews until launch.';
      setOutput(result);
      setProcessing(false);
      notify('✅ Done!');
    },1200);
  }

  return(
    <div className="a-up" style={{maxWidth:800,margin:'0 auto'}}>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20}}>
        {/* Left: Input */}
        <div className="card" style={{padding:24,display:'flex',flexDirection:'column'}}>
          <div className="sec" style={{marginBottom:14}}>Input</div>
          <textarea value={input} onChange={e=>setInput(e.target.value)}
            placeholder="Type, paste notes, or use OCR to scan handwritten notes…"
            style={{flex:1,minHeight:200,background:'var(--surf)',border:'1px solid var(--border)',borderRadius:10,padding:14,color:'var(--text)',fontSize:13,outline:'none',resize:'none',lineHeight:1.7,marginBottom:14}}/>
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            <button className="btn btn-s" onClick={()=>setInput(NOTE_SAMPLE)}>📝 Load Sample</button>
            <button className="btn btn-s" onClick={()=>{setInput('');setOutput(null);}}>🗑️ Clear</button>
            <span className="wc">{input.trim()?input.trim().split(/\s+/).length:0} words, {input.length} characters</span>
          </div>
        </div>

        {/* Right: Actions */}
        <div className="card" style={{padding:24,display:'flex',flexDirection:'column'}}>
          <input type="file" ref={imgInputRef} accept="image/*,.png,.jpg,.jpeg" style={{display:'none'}} onChange={handleImgUpload}/>
          <div className="sec" style={{marginBottom:14}}>Actions</div>
          <div style={{display:'flex',flexDirection:'column',gap:8,marginBottom:16}}>
            {[
              {k:'ocr',icon:'📷',label:'OCR — Scan Image Photo',desc:'Pick photo of notebook / blackboard to transcribe'},
              {k:'summarize',icon:'📋',label:'Summarize',desc:'Extract key points into a bullet list'},
              {k:'improve',icon:'✨',label:'Improve & Clean',desc:'Fix grammar, structure, and formatting'},
              {k:'expand',icon:'📖',label:'Expand & Detail',desc:'Add context, detail, and explanation'},
              {k:'generate',icon:'🤖',label:'Generate New',desc:'Create content from your notes as a prompt'},
            ].map(a=>(
              <button key={a.k} className={`note-action${mode===a.k?' on':''}`} onClick={()=>handleAction(a.k)} disabled={processing}>
                <span style={{fontSize:20}}>{a.icon}</span>
                <div style={{flex:1,textAlign:'left'}}>
                  <div style={{fontWeight:800,fontSize:13,color:mode===a.k?'var(--g)':'var(--text)'}}>{a.label}</div>
                  <div style={{fontSize:11,color:'var(--muted)'}}>{a.desc}</div>
                </div>
                {processing&&mode===a.k&&<span style={{animation:'spin 1s linear infinite',fontSize:14}}>⚙️</span>}
              </button>
            ))}
          </div>

                  </div>
      </div>
      {output&&(()=>{
        const L=output.split('\n'), title=L[0].replace(/:$/,'').replace(/^[^\w]+/,''), body=L.slice(1), txt=body.join('\n').trim();
        const words=txt.split(/\s+/).filter(Boolean).length;
        return(
          <div className="res a-up" style={{marginTop:20}}>
            <div className="res-top">
              <div className="res-file"><span className="fi">✨</span><div><b>{title}</b><small>{words} words</small></div></div>
              <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                <button className="btn btn-p" style={{padding:'9px 18px'}} onClick={()=>{navigator.clipboard?.writeText(txt);notify('Copied');}}>Copy</button>
                <button className="btn btn-s" onClick={()=>{setInput(txt);setOutput(null);notify('Moved to the input box');}}>Edit as input</button>
                <button className="btn btn-s" onClick={()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));a.download='notes.txt';a.click();}}>Download</button>
              </div>
            </div>
            <div className="read-body">{body.map((ln,i)=>{
              if(!ln.trim()) return <div key={i} style={{height:10}}/>;
              const m=ln.match(/^(\d+\.|[-•*])\s+(.*)$/);
              return m?<p key={i} className="nl"><i>{m[1]}</i><span>{hi(m[2])}</span></p>:<p key={i} className="ln">{hi(ln)}</p>;
            })}</div>
          </div>
        );
      })()}
    </div>
  );
}

function App(){
  const [theme, setTheme] = useState('light');
  useEffect(() => { document.documentElement.setAttribute('data-theme', theme); }, [theme]);
  const [page,setPage]=useState('landing');
  function go(p){setPage(p);window.scrollTo({top:0,behavior:'smooth'});}
  return page==='landing'
    ? <LandingPage onEnter={()=>go('workspace')} theme={theme} setTheme={setTheme}/>
    : <Workspace onBack={()=>go('landing')} theme={theme} setTheme={setTheme}/>;
}

ReactDOM.createRoot(document.getElementById('app')).render(<App/>);
